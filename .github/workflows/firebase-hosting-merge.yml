name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
  checks: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production-private
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and verify public content
        uses: ./.github/actions/build-hosting
      - name: Locate the verified deployment content
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          config_path = Path('.firebase-ci/firebase.json').resolve()
          public = json.loads(config_path.read_text())['hosting']['public']
          content = (config_path.parent / public).resolve()
          if config_path.parent not in content.parents:
              raise SystemExit('Hosting content must remain inside its isolated project.')
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'CONTENT_DIR={content}\n')
          PY
      - name: Restore the private document for production only
        env:
          PRIVATE_DOCUMENT_PART_01: '${{ secrets.PRIVATE_DOCUMENT_PART_01 }}'
          PRIVATE_DOCUMENT_PART_02: '${{ secrets.PRIVATE_DOCUMENT_PART_02 }}'
          PRIVATE_DOCUMENT_PART_03: '${{ secrets.PRIVATE_DOCUMENT_PART_03 }}'
          PRIVATE_DOCUMENT_PART_04: '${{ secrets.PRIVATE_DOCUMENT_PART_04 }}'
          PRIVATE_DOCUMENT_PART_05: '${{ secrets.PRIVATE_DOCUMENT_PART_05 }}'
          PRIVATE_DOCUMENT_PART_06: '${{ secrets.PRIVATE_DOCUMENT_PART_06 }}'
          PRIVATE_DOCUMENT_PART_07: '${{ secrets.PRIVATE_DOCUMENT_PART_07 }}'
          PRIVATE_DOCUMENT_PART_08: '${{ secrets.PRIVATE_DOCUMENT_PART_08 }}'
          PRIVATE_DOCUMENT_PART_09: '${{ secrets.PRIVATE_DOCUMENT_PART_09 }}'
          PRIVATE_DOCUMENT_PART_10: '${{ secrets.PRIVATE_DOCUMENT_PART_10 }}'
          PRIVATE_DOCUMENT_PART_11: '${{ secrets.PRIVATE_DOCUMENT_PART_11 }}'
          PRIVATE_DOCUMENT_PART_12: '${{ secrets.PRIVATE_DOCUMENT_PART_12 }}'
          PRIVATE_DOCUMENT_PART_COUNT: '${{ vars.PRIVATE_DOCUMENT_PART_COUNT }}'
          PRIVATE_DOCUMENT_BUNDLE_SHA256: '${{ secrets.PRIVATE_DOCUMENT_BUNDLE_SHA256 }}'
        run: python3 scripts/restore_private_document.py --root "$CONTENT_DIR" --manifest .firebase-ci/private-document.json
      - name: Verify the complete production release
        run: python3 scripts/verify_site_build.py --root "$CONTENT_DIR" --private-manifest .firebase-ci/private-document.json
      - name: Verify production response headers locally
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: '1'
        run: >-
          firebase emulators:exec --only hosting --project demo-mele-ci
          --config .firebase-ci/firebase.json
          'python3 scripts/verify_hosting_cache.py --root "$CONTENT_DIR" --url http://127.0.0.1:1341'
      - uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANTONIOANNAMELE }}'
          channelId: live
          projectId: antonioannamele
          entryPoint: .firebase-ci
          firebaseToolsVersion: '13.29.1'
